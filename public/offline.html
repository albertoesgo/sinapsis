<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030409" />
  <title>Sin conexión</title>
  <style>
    html, body { margin: 0; min-height: 100dvh; background: #030409; color: #ece9e1; font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    main { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box; }
    h1 { font-weight: 500; font-size: 24px; margin: 0 0 8px; }
    p { color: #9ba1ae; margin: 0 0 20px; }
    button { font: inherit; color: #030409; background: #ece9e1; border: 0; border-radius: 22px; min-height: 44px; padding: 0 22px; touch-action: manipulation; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>Sin conexión</h1>
      <p>Sinapsis necesita conectar con tu ordenador (o con internet, en la demo). En cuanto vuelva la conexión, se carga sola.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
